name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 10 Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore Backend_Project_OTSP.tests/Backend_Project_OTSP.tests.csproj
      - name: Build Backend
        run: dotnet build Backend_Project_OTSP/Backend_Project_OTSP.csproj --no-restore --configuration Release
      - name: Run Tests
        run: dotnet test Backend_Project_OTSP.tests/Backend_Project_OTSP.tests.csproj --no-restore --configuration Release

  frontend:
    name: Frontend (Lint & Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fontend_Project_OTSP
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Fontend_Project_OTSP/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

